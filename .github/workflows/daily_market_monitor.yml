name: Daily A-share Market Monitor

on:
  schedule:
    # GitHub cron 使用 UTC：上海时间工作日 15:20。
    # 若数据日期、分页或关键字段校验失败，任务直接失败并暴露生产问题，不自动补跑。
    - cron: "20 7 * * 1-5"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Trading date, YYYY-MM-DD; blank uses Asia/Shanghai today"
        required: false
        default: ""
      refresh_mapping:
        description: "Force refresh Shenwan stock mapping"
        required: false
        type: boolean
        default: false
      full_refresh_sw_industry:
        description: "Run slow per-index refresh for the separate Shenwan-industry mother table"
        required: false
        type: boolean
        default: false
      force_hot_snapshot:
        description: "Archive weekly 10bn-turnover stock snapshot outside Friday"
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - market-monitor/run_daily.py
      - market-monitor/run_history_preflight.py
      - market-monitor/validate_canonical_data.py
      - market-monitor/build_report_data.py
      - market-monitor/render_market_monitor_html.py
      - market-monitor/validate_market_monitor_html.py
      - market-monitor/market_monitor/**
      - market-monitor/update_sw_industry.py
      - market-monitor/update_sw_industry_fast.py
      - market-monitor/tests/**
      - market-monitor/config/market_monitor.json
      - market-monitor/config/html_production_runtime.json
      - market-monitor/data/history/hot_stocks.csv
      - backend/market_monitor/daily_refresh.py
      - backend/market_monitor/stock_pool.py
      - data/stock-pool/**
      - market-monitor/requirements.txt
      - .github/workflows/daily_market_monitor.yml

concurrency:
  group: vibe-research-data-writer
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    working-directory: market-monitor

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve date
        id: date
        shell: bash
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            target="${{ inputs.target_date }}"
          else
            now_hm="$(date +%H%M)"
            if [ "$now_hm" -lt 1200 ]; then
              target="$(date -d 'yesterday' +%F)"
            else
              target="$(date +%F)"
            fi
          fi
          echo "value=$target" >> "$GITHUB_OUTPUT"
          echo "compact=${target//-/}" >> "$GITHUB_OUTPUT"

      - name: Fast syntax preflight
        run: |
          python -m py_compile \
            run_daily.py run_history_preflight.py validate_canonical_data.py build_report_data.py \
            render_market_monitor_html.py validate_market_monitor_html.py audit_mother_tables.py \
            update_sw_industry.py update_sw_industry_fast.py rebuild_eastmoney_sectors.py
          python -m py_compile market_monitor/*.py

      - name: Full unit tests on code review only
        if: github.event_name == 'pull_request'
        run: python -m unittest discover -s tests -v

      - name: Build 2026-08-14 HTML acceptance prototype on PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python run_history_preflight.py --target-date "2026-08-14"
          python validate_canonical_data.py \
            --target-date "2026-08-14" \
            --output "output/2026-08-14/canonical_validation.json"
          python build_report_data.py --target-date "2026-08-14"
          python render_market_monitor_html.py \
            --input "output/2026-08-14/report_data.json" \
            --output "output/2026-08-14/A股每日市场监控_20260814.html"
          python validate_market_monitor_html.py \
            --data "output/2026-08-14/report_data.json" \
            --html "output/2026-08-14/A股每日市场监控_20260814.html" \
            --output "output/2026-08-14/html_validation.json"

      - name: Upload 2026-08-14 HTML acceptance prototype
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: html-prototype-2026-08-14
          path: |
            market-monitor/output/2026-08-14/A股每日市场监控_20260814.html
            market-monitor/output/2026-08-14/report_data.json
            market-monitor/output/2026-08-14/canonical_manifest.json
            market-monitor/output/2026-08-14/canonical_validation.json
            market-monitor/output/2026-08-14/html_validation.json
            market-monitor/output/2026-08-14/history_preflight.json
            market-monitor/data/history/indices_history.csv
          if-no-files-found: error
          retention-days: 14

      - name: Produce normalized payload
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          args=""
          if [ "${{ inputs.refresh_mapping }}" = "true" ]; then
            args="$args --refresh-mapping"
          fi
          if [ "${{ inputs.full_refresh_sw_industry }}" = "true" ]; then
            args="$args --full-refresh-sw-industry"
          fi
          if [ "${{ inputs.force_hot_snapshot }}" = "true" ]; then
            args="$args --force-hot-snapshot"
          fi
          # 15:20 启动；接口尚未形成完整快照时，每 5 分钟重试。
          # run_daily 只按日期 upsert 唯一母表。
          for attempt in 1 2 3 4 5; do
            if python run_daily.py --target-date "${{ steps.date.outputs.value }}" $args; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "收盘数据在 5 次检查后仍未完整" >&2
              exit 1
            fi
            echo "收盘数据尚未完整，5 分钟后重试（$attempt/5）"
            sleep 300
          done

      - name: Audit mother tables
        if: github.event_name != 'pull_request'
        run: python audit_mother_tables.py --target-date "${{ steps.date.outputs.value }}"

      - name: Persist mother tables
        if: github.event_name != 'pull_request'
        shell: bash
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            market-monitor/data/history \
            market-monitor/data/sw_industry_history.csv market-monitor/data/sw_industry_latest.csv
          if git diff --cached --quiet; then
            echo "No persistent data changes"
          else
            git commit -m "data: update market mother tables ${{ steps.date.outputs.value }}"
            git pull --rebase origin main
            git push
          fi
