name: Daily stock-pool compact cache

on:
  # Build the compact cache only after the post-close mother-table workflow
  # has completed successfully. This removes the 15:20 same-minute race.
  workflow_run:
    workflows: ["Daily A-share Market Monitor"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_date:
        description: "Trading date, YYYY-MM-DD; blank uses Asia/Shanghai today"
        required: false
        default: ""

concurrency:
  group: vibe-research-data-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'pull_request' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve and validate snapshot date
        id: date
        shell: bash
        run: |
          today="$(date +%F)"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # The upstream run is post-close and owns the production date.
            target="$(date -d "${{ github.event.workflow_run.updated_at }}" +%F)"
          elif [ -n "${{ inputs.target_date }}" ]; then
            target="${{ inputs.target_date }}"
          else
            target="$today"
          fi

          if ! [[ "$target" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid target_date: $target (expected YYYY-MM-DD)" >&2
            exit 1
          fi

          # This workflow reads a live quote snapshot; it cannot safely backfill
          # a historical date or label intraday quotes as a close.
          if [ "$target" != "$today" ]; then
            echo "Compact cache only supports today's live close snapshot: target=$target today=$today" >&2
            exit 1
          fi

          now_hm="$(date +%H%M)"
          if [ "$now_hm" -lt 1520 ]; then
            echo "Post-close snapshot is not ready: $(date --iso-8601=seconds). Retry at or after 15:20 Asia/Shanghai." >&2
            exit 1
          fi

          echo "value=$target" >> "$GITHUB_OUTPUT"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Refresh overwrite-only cache
        working-directory: backend
        run: python -m market_monitor.daily_refresh --date "${{ steps.date.outputs.value }}"

      - name: Persist compact cache
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/stock-pool/pool.json data/stock-pool/stocks.csv \
            data/stock-pool/indices.csv data/stock-pool/latest_stock_pool.json
          if git diff --cached --quiet; then
            echo "No stock-pool cache changes"
          else
            git commit -m "data: refresh stock-pool compact cache ${{ steps.date.outputs.value }}"
            git pull --rebase origin main
            git push
          fi
