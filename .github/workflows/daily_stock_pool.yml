name: Daily stock-pool compact cache

on:
  # 股票池是独立子页：收盘后自行刷新，不依赖市场总览生产结果。
  schedule:
    - cron: "25 7 * * 1-5"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Trading date, YYYY-MM-DD; blank uses Asia/Shanghai today"
        required: false
        default: ""

concurrency:
  group: vibe-research-stock-pool-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve and validate snapshot date
        id: date
        shell: bash
        run: |
          today="$(date +%F)"
          now_hm="$(date +%H%M)"
          if [ "$now_hm" -lt 1200 ]; then
            expected_target="$(date -d 'yesterday' +%F)"
          else
            expected_target="$today"
          fi
          if [ -n "${{ inputs.target_date }}" ]; then
            target="${{ inputs.target_date }}"
          else
            target="$expected_target"
          fi

          if ! [[ "$target" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid target_date: $target (expected YYYY-MM-DD)" >&2
            exit 1
          fi

          # If GitHub delays the trigger into early next morning, rebuild yesterday's close.
          if [ "$target" != "$expected_target" ]; then
            echo "Compact cache target mismatch: target=$target expected=$expected_target now=$(date --iso-8601=seconds)" >&2
            exit 1
          fi

          if [ "$target" = "$today" ] && [ "$now_hm" -lt 1520 ]; then
            echo "Post-close snapshot is not ready: $(date --iso-8601=seconds). Retry at or after 15:20 Asia/Shanghai." >&2
            exit 1
          fi

          echo "value=$target" >> "$GITHUB_OUTPUT"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Refresh overwrite-only cache
        working-directory: backend
        run: python -m market_monitor.daily_refresh --date "${{ steps.date.outputs.value }}"

      - name: Persist compact cache
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/stock-pool/pool.json data/stock-pool/stocks.csv \
            data/stock-pool/indices.csv data/stock-pool/latest_stock_pool.json
          if git diff --cached --quiet; then
            echo "No stock-pool cache changes"
          else
            git commit -m "data: refresh stock-pool compact cache ${{ steps.date.outputs.value }}"
            git pull --rebase origin main
            git push
          fi
